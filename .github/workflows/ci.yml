name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install UI build deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --workspace --locked --release

      - name: Upload binaries (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: chrona-linux-${{ github.ref_name }}
          path: |
            target/release/chrona
            target/release/chronad

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install UI build deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev

      - name: Build release binaries
        run: cargo build --workspace --locked --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/chrona target/release/chronad dist/
          cp README.md LICENSE dist/
          cd dist && tar czf ../chrona-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz .

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: chrona-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz
          generate_release_notes: true
